name: Build on archlinux

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

env:
  BUILD_TYPE: Release

jobs:
  meson-build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        pacman -Syu --noconfirm arch-install-scripts
        pacman-key --init
        pacman-key --populate archlinux

    - name: Update package databases
      run: pacman -Sy

    - name: Install dep
      run: |
        pacman -S --noconfirm \
          base-devel \
          meson \
          pkgconfig \
          wayland \
          wayland-protocols \
          wlr-protocols \
          libxcb \
          xcb-util-wm \
          clang \
          ninja \
          cppcheck \
          doxygen \
          graphviz \
          libxslt \
          xmlto \
          libxml2 \
          cairo \
          pango \
          glib2 \
          mesa \
          glslang \
          libdrm \
          pixman \
          lcms2 \

    - name: Install wlframe
      run: |
        pacman -S --noconfirm \
          base-devel \
          meson \
          ninja \
          gcc \
          clang \
          pkg-config \
          wayland \
          wayland-protocols \
          libpng \
          libjpeg-turbo	\
          cppcheck \
          vulkan-icd-loader \
          vulkan-headers \
          glslang \
          doxygen \
          graphviz \
          libxslt \
          xmlto \
          libxml2 \
          mesa \
          libdrm \
          pixman \
          cairo \
          pango \
          harfbuzz \
          libwebp \
          wlr-protocols \
          giflib \
          glib2 \
          git \

        git clone https://github.com/zzxyb/wlframe.git /tmp/wlframe
        cd /tmp/wlframe
        meson setup builddir --prefix=/usr
        ninja -C builddir
        ninja -C builddir install

    - name: Install tomlc99
      run: |
        git clone https://github.com/cktan/tomlc99.git /tmp/tomlc99
        cd /tmp/tomlc99
        make
        make install prefix=/usr

    - name: Build and install wlroots
      run: |
        pacman -S --noconfirm \
          clang \
          lcms2 \
          libinput \
          libdisplay-info \
          libliftoff \
          libxkbcommon \
          mesa \
          meson \
          pixman \
          wayland \
          wayland-protocols \
          xcb-util-errors \
          xcb-util-image \
          xcb-util-renderutil \
          xcb-util-wm \
          xorg-xwayland \
          seatd \
          vulkan-icd-loader \
          vulkan-headers \
          glslang \
          hwdata

        git clone https://gitlab.freedesktop.org/wlroots/wlroots.git /tmp/wlroots
        meson setup /tmp/wlroots/build /tmp/wlroots --prefix=/usr -Dexamples=false -Dxwayland=enabled
        ninja -C /tmp/wlroots/build
        ninja -C /tmp/wlroots/build install

    - name: Build with Meson
      run: |
        meson setup builddir -Dxwayland=enabled
        ninja -C builddir

    - name: Run cppcheck
      run: cppcheck --project=builddir/compile_commands.json
